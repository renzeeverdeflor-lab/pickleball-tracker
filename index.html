<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pickleball Student Progress Tracker</title>

<style>

/* =========================================================
   VARIABLES
========================================================= */

:root{
  --green:#16745a;
  --green2:#1f8b6b;
  --light:#f4f8f6;
  --dark:#18322a;
  --muted:#6c7d76;
  --border:#dce7e2;
  --white:#ffffff;
  --danger:#c94b4b;
}


/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--light);
  color:var(--dark);
}


/* =========================================================
   LOGIN SCREEN
========================================================= */

#loginScreen{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#125c48,#22916e);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999;
}

.login-box{
  width:min(410px,100%);
  background:#fff;
  border-radius:20px;
  padding:32px;
  box-shadow:0 18px 50px #0004;
}

.login-logo{
  text-align:center;
  font-size:42px;
  margin-bottom:8px;
}

.login-box h2{
  text-align:center;
  margin:0 0 7px;
  color:#18322a;
}

.login-sub{
  text-align:center;
  color:#6c7d76;
  margin:0 0 24px;
}

.login-form{
  display:grid;
  gap:14px;
}

.login-form label{
  font-size:13px;
  font-weight:bold;
  color:#42554e;
}

.login-form input{
  width:100%;
  margin-top:6px;
}

.login-btn{
  width:100%;
  background:#16745a;
  color:#fff;
  padding:13px;
  border-radius:10px;
  border:0;
  font-weight:bold;
  cursor:pointer;
}

.login-btn:hover{
  background:#105d48;
}

.login-error{
  display:none;
  color:#c94b4b;
  background:#fff0f0;
  border-radius:9px;
  padding:10px;
  font-size:13px;
  text-align:center;
}


/* =========================================================
   HEADER
========================================================= */

header{
  background:linear-gradient(135deg,#125c48,#22916e);
  color:white;
  padding:26px 6%;
  box-shadow:0 3px 12px #0002;
}

header h1{
  margin:0 0 6px;
  font-size:28px;
}

header p{
  margin:0;
  opacity:.88;
}

.header-content{
  max-width:1200px;
  margin:auto;
  position:relative;
}

.logout-btn{
  position:absolute;
  right:0;
  top:0;
}

@media(max-width:600px){

  .logout-btn{
    position:static;
    margin-top:15px;
  }

}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{
  max-width:1200px;
  margin:28px auto;
  padding:0 20px;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:22px;
}

input,
select,
textarea{
  font:inherit;
  border:1px solid var(--border);
  border-radius:10px;
  padding:11px 13px;
  outline:none;
  background:white;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--green2);
  box-shadow:0 0 0 3px #1f8b6b18;
}

.search{
  flex:1;
  min-width:240px;
}

.student-dropdown{
  min-width:280px;
  cursor:pointer;
  background:white;
}

.student-dropdown:focus{
  border-color:var(--green2);
  box-shadow:0 0 0 3px #1f8b6b18;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 17px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:var(--green);
  color:white;
}

.primary:hover{
  background:#105d48;
}

.secondary{
  background:white;
  border:1px solid var(--border);
  color:var(--dark);
}

.secondary:hover{
  background:#f5f8f6;
}

.danger{
  background:#fff0f0;
  color:var(--danger);
}

.danger:hover{
  background:#ffe4e4;
}


/* =========================================================
   PROFILE CARD
========================================================= */

.profile-card{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:25px;
  box-shadow:0 4px 15px #18322a0a;
  min-height:500px;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty{
  color:var(--muted);
  text-align:center;
  padding:70px 20px;
}

.empty-icon{
  font-size:50px;
  margin-bottom:10px;
}

.empty h2{
  margin:10px 0;
  color:var(--dark);
}


/* =========================================================
   PROFILE HEADER
========================================================= */

.profile-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
  flex-wrap:wrap;
  border-bottom:1px solid var(--border);
  padding-bottom:18px;
  margin-bottom:20px;
}

.profile-head h2{
  margin:0 0 7px;
  font-size:26px;
}

.profile-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.badge{
  display:inline-block;
  background:#e8f5ef;
  color:var(--green);
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}


/* =========================================================
   OVERALL PROGRESS
========================================================= */

.overall{
  padding:18px;
  background:#f2f8f5;
  border-radius:12px;
  margin-bottom:25px;
}

.overall-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.overall-score{
  font-size:20px;
  font-weight:bold;
  color:var(--green);
}

.bar{
  height:12px;
  background:#dfeae5;
  border-radius:99px;
  overflow:hidden;
  margin-top:12px;
}

.bar span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#1f8b6b,#62b991);
  border-radius:99px;
  transition:width .3s ease;
}


/* =========================================================
   SKILLS
========================================================= */

.skills-title{
  margin-bottom:12px;
}

.skills{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin:20px 0 30px;
}

.skill{
  border:1px solid var(--border);
  border-radius:13px;
  padding:17px;
  transition:.15s;
}

.skill:hover{
  border-color:#b9dace;
  box-shadow:0 3px 10px #18322a08;
}

.skill-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  font-weight:bold;
}

.skill-score{
  color:var(--green);
  font-size:14px;
}

.stars{
  display:flex;
  gap:6px;
}

.star{
  width:34px;
  height:34px;
  border-radius:7px;
  border:1px solid #d5e2dc;
  background:white;
  color:#c7d1cc;
  cursor:pointer;
  font-size:17px;
  padding:0;
  transition:.15s;
}

.star:hover{
  border-color:var(--green2);
  transform:translateY(-1px);
}

.star.on{
  background:#e7f5ef;
  color:#f0a72c;
  border-color:#bfe2d2;
}


/* =========================================================
   NOTES
========================================================= */

.student-notes{
  background:#fafcfb;
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
  margin-bottom:25px;
}

.student-notes-title{
  font-size:13px;
  font-weight:bold;
  color:var(--muted);
  margin-bottom:7px;
}


/* =========================================================
   ASSESSMENT HISTORY
========================================================= */

.history-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin:25px 0 12px;
}

.history-header h3{
  margin:0;
}

.history-table{
  overflow:auto;
  border:1px solid var(--border);
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
  min-width:700px;
}

th,
td{
  text-align:left;
  padding:11px 10px;
  border-bottom:1px solid var(--border);
}

th{
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
  background:#fafcfb;
}

tbody tr:last-child td{
  border-bottom:0;
}

tbody tr:hover{
  background:#fafcfb;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;
  background:#0007;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:white;
  width:min(520px,100%);
  border-radius:18px;
  padding:24px;
  max-height:90vh;
  overflow:auto;
}

.modal-box h2{
  margin-top:0;
}

.form-grid{
  display:grid;
  gap:13px;
}

label{
  font-size:13px;
  font-weight:bold;
  color:#42554e;
}

textarea{
  min-height:100px;
  resize:vertical;
  width:100%;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:18px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:850px){

  .skills{
    grid-template-columns:1fr;
  }

  .student-dropdown{
    flex:1;
    min-width:220px;
  }

}

@media(max-width:600px){

  .container{
    padding:0 12px;
  }

  .toolbar{
    flex-direction:column;
  }

  .search,
  .student-dropdown,
  .toolbar button{
    width:100%;
  }

  .profile-card{
    padding:17px;
  }

  .profile-head h2{
    font-size:22px;
  }

  .profile-actions{
    width:100%;
  }

  .profile-actions button{
    flex:1;
  }

}


/* =========================================================
   LOADING
========================================================= */

.loading{
  text-align:center;
  padding:50px;
  color:var(--muted);
}

.spinner{
  display:inline-block;
  width:30px;
  height:30px;
  border:3px solid #dce7e2;
  border-top-color:var(--green);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin-bottom:10px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

</style>

</head>

<body>


<!-- =======================================================
     LOGIN SCREEN
======================================================== -->

<div id="loginScreen">

  <div class="login-box">

    <div class="login-logo">
      🏓
    </div>

    <h2>
      Pickleball Progress Tracker
    </h2>

    <p class="login-sub">
      Coach Login
    </p>

    <form
      class="login-form"
      onsubmit="login(event)"
    >

      <div>

        <label>
          Email
        </label>

        <input
          id="loginUsername"
          type="email"
          autocomplete="username"
          placeholder="Enter email"
          required
        >

      </div>


      <div>

        <label>
          Password
        </label>

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Enter password"
          required
        >

      </div>


      <div
        id="loginError"
        class="login-error"
      >
        Incorrect email or password.
      </div>


      <button
        class="login-btn"
        type="submit"
      >
        Login
      </button>

    </form>

  </div>

</div>


<!-- =======================================================
     HEADER
======================================================== -->

<header>

  <div class="header-content">

    <h1>
      🏓 Pickleball Student Progress Tracker
    </h1>

    <p>
      Track skills, assessments, notes, and student development.
    </p>

    <button
      class="secondary logout-btn"
      onclick="logout()"
    >
      Log Out
    </button>

  </div>

</header>


<!-- =======================================================
     MAIN
======================================================== -->

<div class="container">


  <!-- =====================================================
       TOOLBAR
  ====================================================== -->

  <div class="toolbar">

    <!-- Search -->

    <input
      id="search"
      class="search"
      type="search"
      placeholder="🔍 Search student name..."
    >


    <!-- Student Dropdown -->

    <select
      id="studentDropdown"
      class="student-dropdown"
    >

      <option value="">
        Select Student
      </option>

    </select>


    <!-- Add Student -->

    <button
      class="primary"
      onclick="openStudentModal()"
    >
      ＋ Add Student
    </button>

  </div>


  <!-- =====================================================
       PROFILE
  ====================================================== -->

  <div
    class="profile-card"
    id="profile"
  >

    <div class="empty">

      <div class="empty-icon">
        🏓
      </div>

      <h2>
        Select a Student
      </h2>

      <p>
        Use the dropdown above to select a student
        and view their progress.
      </p>

    </div>

  </div>

</div>


<!-- =======================================================
     ADD / EDIT STUDENT MODAL
======================================================== -->

<div
  id="studentModal"
  class="modal"
>

  <div class="modal-box">

    <h2 id="modalTitle">
      Add Student
    </h2>


    <div class="form-grid">


      <!-- Student Name -->

      <div>

        <label>
          Student Name
        </label>

        <input
          id="studentName"
          style="width:100%"
          placeholder="e.g. Juan Dela Cruz"
        >

      </div>


      <!-- Status -->

      <div>

        <label>
          Status
        </label>

        <select
          id="studentStatus"
          style="width:100%"
        >

          <option value="Active">
            Active
          </option>

          <option value="Inactive">
            Inactive
          </option>

        </select>

      </div>


      <!-- Notes -->

      <div>

        <label>
          Notes
        </label>

        <textarea
          id="studentNotes"
          placeholder="General student notes..."
        ></textarea>

      </div>

    </div>


    <!-- Modal Buttons -->

    <div class="modal-actions">

      <button
        class="secondary"
        onclick="closeStudentModal()"
      >
        Cancel
      </button>

      <button
        class="primary"
        onclick="saveStudent()"
      >
        Save Student
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     FIREBASE
======================================================== -->

<script type="module">


/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc
}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBxVLsNp44bujiEHSmvBA2Rj_dpN7oUkOc",

  authDomain:
    "pickleball-student-tracker.firebaseapp.com",

  projectId:
    "pickleball-student-tracker",

  storageBucket:
    "pickleball-student-tracker.firebasestorage.app",

  messagingSenderId:
    "65790679121",

  appId:
    "1:65790679121:web:95f38687a8b4c03b38c070"

};


/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


const studentsCollection =
  collection(
    db,
    "students"
  );


const auth =
  getAuth(app);


/* =========================================================
   LOGIN DISPLAY
========================================================= */

function showLogin(){

  document.getElementById(
    "loginScreen"
  ).style.display = "flex";


  setTimeout(
    () =>
      document
        .getElementById(
          "loginUsername"
        )
        .focus(),
    50
  );

}


function hideLogin(){

  document.getElementById(
    "loginScreen"
  ).style.display = "none";

}


/* =========================================================
   LOGIN
========================================================= */

window.login =
async function(event){

  event.preventDefault();


  const email =
    document
      .getElementById(
        "loginUsername"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "loginPassword"
      )
      .value;


  const error =
    document.getElementById(
      "loginError"
    );


  const button =
    event.submitter;


  error.style.display =
    "none";


  if(button){

    button.disabled =
      true;

    button.textContent =
      "Logging in...";

  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );


    document.getElementById(
      "loginPassword"
    ).value = "";

  }

  catch(err){

    console.error(err);


    error.textContent =
      "Incorrect email or password.";


    error.style.display =
      "block";


    document
      .getElementById(
        "loginPassword"
      )
      .select();

  }

  finally{

    if(button){

      button.disabled =
        false;

      button.textContent =
        "Login";

    }

  }

};


/* =========================================================
   LOGOUT
========================================================= */

window.logout =
async function(){

  await signOut(auth);

};


/* =========================================================
   SKILLS
========================================================= */

const skills = [

  "Forehand Drive",

  "Backhand Drive",

  "Dink",

  "Serve",

  "Return",

  "Volley"

];


let students = [];

let selectedId = null;

let editingId = null;


/* =========================================================
   LOAD STUDENTS
========================================================= */

async function loadStudents(){

  try{

    const snapshot =
      await getDocs(
        studentsCollection
      );


    students =
      snapshot.docs.map(
        d => ({
          id:d.id,
          ...d.data()
        })
      );


    /* -----------------------------------------------
       Make sure every student has proper data
    ------------------------------------------------ */

    students.forEach(
      s => {

        s.progress =
          s.progress || {};


        skills.forEach(
          skill => {

            const key =
              skillKey(skill);


            if(
              typeof s.progress[key]
              !== "number"
            ){

              s.progress[key] =
                0;

            }

          }
        );


        s.history =
          Array.isArray(
            s.history
          )
            ? s.history
            : [];


        s.status =
          s.status ||
          "Active";


        s.notes =
          s.notes ||
          "";

      }
    );


    /* -----------------------------------------------
       Sort students alphabetically
    ------------------------------------------------ */

    students.sort(
      (a,b) =>
        a.name.localeCompare(
          b.name
        )
    );


    /* -----------------------------------------------
       Select first student
    ------------------------------------------------ */

    selectedId =
      students[0]?.id ||
      null;


    renderStudentDropdown();

    renderProfile();

  }

  catch(error){

    console.error(
      "Firestore load error:",
      error
    );


    alert(
      "Could not load students from Firebase. " +
      "Check your Firebase configuration and Firestore rules."
    );

  }

}


/* =========================================================
   RENDER STUDENT DROPDOWN
========================================================= */

function renderStudentDropdown(){

  const dropdown =
    document.getElementById(
      "studentDropdown"
    );


  const currentValue =
    selectedId || "";


  dropdown.innerHTML = `

    <option value="">
      Select Student
    </option>

    ${
      students
        .slice()
        .sort(
          (a,b) =>
            a.name.localeCompare(
              b.name
            )
        )
        .map(
          s => `

            <option
              value="${s.id}"
              ${
                s.id === currentValue
                  ? "selected"
                  : ""
              }
            >

              ${escapeHtml(s.name)}

            </option>

          `
        )
        .join("")
    }

  `;

}


/* =========================================================
   DROPDOWN CHANGE
========================================================= */

document
  .getElementById(
    "studentDropdown"
  )
  .addEventListener(
    "change",
    function(){

      selectedId =
        this.value ||
        null;


      renderProfile();

    }
  );


/* =========================================================
   SEARCH
========================================================= */

document
  .getElementById(
    "search"
  )
  .addEventListener(
    "input",
    function(){

      const query =
        this.value
          .trim()
          .toLowerCase();


      const dropdown =
        document.getElementById(
          "studentDropdown"
        );


      const filtered =
        students.filter(
          s =>
            s.name
              .toLowerCase()
              .includes(query)
        );


      /*
        Rebuild dropdown based
        on search result
      */

      dropdown.innerHTML = `

        <option value="">
          ${
            filtered.length
              ? "Select Student"
              : "No students found"
          }
        </option>

        ${
          filtered
            .map(
              s => `

                <option
                  value="${s.id}"
                  ${
                    s.id === selectedId
                      ? "selected"
                      : ""
                  }
                >

                  ${escapeHtml(s.name)}

                </option>

              `
            )
            .join("")
        }

      `;

    }
  );


/* =========================================================
   RENDER PROFILE
========================================================= */

function renderProfile(){

  const s =
    students.find(
      x =>
        x.id === selectedId
    );


  const box =
    document.getElementById(
      "profile"
    );


  if(!s){

    box.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🏓
        </div>

        <h2>
          Select a Student
        </h2>

        <p>
          Use the dropdown above to select
          a student and view their progress.
        </p>

      </div>

    `;

    return;

  }


  const current =
    s.progress;


  const avg =
    Object
      .values(current)
      .reduce(
        (a,b) =>
          a + b,
        0
      )
      /
      skills.length;


  box.innerHTML = `

    <!-- PROFILE HEADER -->

    <div class="profile-head">

      <div>

        <h2>
          ${escapeHtml(s.name)}
        </h2>

        <span class="badge">
          ${escapeHtml(s.status)}
        </span>

      </div>


      <div class="profile-actions">

        <button
          class="secondary"
          onclick="openStudentModal('${s.id}')"
        >
          ✏️ Edit Student
        </button>


        <button
          class="danger"
          onclick="deleteStudent('${s.id}')"
        >
          🗑 Delete
        </button>

      </div>

    </div>


    <!-- OVERALL PROGRESS -->

    <div class="overall">

      <div class="overall-header">

        <strong>
          Overall Progress
        </strong>

        <span class="overall-score">
          ${avg.toFixed(1)} / 5
        </span>

      </div>


      <div class="bar">

        <span
          style="
            width:${avg / 5 * 100}%
          "
        ></span>

      </div>

    </div>


    <!-- NOTES -->

    <div class="student-notes">

      <div class="student-notes-title">
        STUDENT NOTES
      </div>

      <div>
        ${
          escapeHtml(
            s.notes ||
            "No general notes."
          )
        }
      </div>

    </div>


    <!-- SKILLS -->

    <h3 class="skills-title">
      Current Skills
    </h3>


    <div class="skills">

      ${
        skills
          .map(
            skill =>
              skillCard(
                skill
              )
          )
          .join("")
      }

    </div>


    <!-- ASSESSMENT HISTORY -->

    <div class="history-header">

      <h3>
        Assessment History
      </h3>


      <button
        class="primary"
        onclick="addAssessment()"
      >
        ＋ Save Assessment
      </button>

    </div>


    ${historyTable(s)}

  `;

}


/* =========================================================
   SKILL CARD
========================================================= */

function skillCard(skill){

  const key =
    skillKey(skill);


  const student =
    students.find(
      x =>
        x.id === selectedId
    );


  const value =
    student?.progress[key] ||
    0;


  return `

    <div class="skill">

      <div class="skill-top">

        <span>
          ${skill}
        </span>

        <span class="skill-score">
          ${value}/5
        </span>

      </div>


      <div class="stars">

        ${
          [1,2,3,4,5]
            .map(
              n => `

                <button
                  type="button"
                  class="star ${
                    n <= value
                      ? "on"
                      : ""
                  }"
                  onclick="setSkill('${key}',${n})"
                  title="Rate ${skill} ${n}/5"
                >
                  ★
                </button>

              `
            )
            .join("")
        }

      </div>

    </div>

  `;

}


/* =========================================================
   SET SKILL
========================================================= */

window.setSkill =
async function(
  key,
  value
){

  const s =
    students.find(
      x =>
        x.id === selectedId
    );


  if(!s)
    return;


  /* Update locally */

  s.progress[key] =
    value;


  /* Update screen */

  renderProfile();


  /* Save to Firebase */

  try{

    await updateDoc(

      doc(
        db,
        "students",
        s.id
      ),

      {
        progress:
          s.progress
      }

    );

  }

  catch(error){

    console.error(
      "Firestore skill save error:",
      error
    );


    alert(
      "Could not save the skill rating to Firebase."
    );

  }

};


/* =========================================================
   SAVE ASSESSMENT
========================================================= */

window.addAssessment =
async function(){

  const s =
    students.find(
      x =>
        x.id === selectedId
    );


  if(!s)
    return;


  const today =
    new Date()
      .toISOString()
      .slice(0,10);


  s.history.unshift({

    date:today,

    ...s.progress

  });


  try{

    await updateDoc(

      doc(
        db,
        "students",
        s.id
      ),

      {
        history:
          s.history
      }

    );


    renderProfile();

  }

  catch(error){

    console.error(
      "Firestore assessment save error:",
      error
    );


    alert(
      "Could not save the assessment to Firebase."
    );

  }

};


/* =========================================================
   HISTORY TABLE
========================================================= */

function historyTable(s){

  if(!s.history.length){

    return `

      <div class="empty">

        No assessments yet.

        <br><br>

        Rate the skills above,
        then click
        <strong>Save Assessment</strong>.

      </div>

    `;

  }


  return `

    <div class="history-table">

      <table>

        <thead>

          <tr>

            <th>
              Date
            </th>

            ${
              skills
                .map(
                  x =>
                    `<th>${x}</th>`
                )
                .join("")
            }

          </tr>

        </thead>


        <tbody>

          ${
            s.history
              .map(
                h => `

                  <tr>

                    <td>
                      ${h.date}
                    </td>

                    ${
                      skills
                        .map(
                          x => `

                            <td>

                              ${
                                h[
                                  skillKey(x)
                                ] || 0
                              }/5

                            </td>

                          `
                        )
                        .join("")
                    }

                  </tr>

                `
              )
              .join("")
          }

        </tbody>

      </table>

    </div>

  `;

}


/* =========================================================
   SKILL KEY
========================================================= */

function skillKey(s){

  return s
    .toLowerCase()
    .replaceAll(
      " ",
      "_"
    );

}


/* =========================================================
   OPEN STUDENT MODAL
========================================================= */

window.openStudentModal =
function(id=null){

  editingId =
    id;


  const s =
    id
      ? students.find(
          x =>
            x.id === id
        )
      : null;


  document.getElementById(
    "modalTitle"
  ).textContent =
    s
      ? "Edit Student"
      : "Add Student";


  document.getElementById(
    "studentName"
  ).value =
    s?.name ||
    "";


  document.getElementById(
    "studentStatus"
  ).value =
    s?.status ||
    "Active";


  document.getElementById(
    "studentNotes"
  ).value =
    s?.notes ||
    "";


  document
    .getElementById(
      "studentModal"
    )
    .classList
    .add("show");


  setTimeout(
    () =>
      document
        .getElementById(
          "studentName"
        )
        .focus(),
    50
  );

};


/* =========================================================
   CLOSE MODAL
========================================================= */

window.closeStudentModal =
function(){

  document
    .getElementById(
      "studentModal"
    )
    .classList
    .remove("show");


  editingId =
    null;

};


/* =========================================================
   SAVE STUDENT
========================================================= */

window.saveStudent =
async function(){

  const name =
    document
      .getElementById(
        "studentName"
      )
      .value
      .trim();


  if(!name){

    alert(
      "Please enter the student name."
    );

    return;

  }


  const status =
    document.getElementById(
      "studentStatus"
    ).value;


  const notes =
    document
      .getElementById(
        "studentNotes"
      )
      .value
      .trim();


  try{

    /* =====================================================
       EDIT EXISTING STUDENT
    ====================================================== */

    if(editingId){

      const s =
        students.find(
          x =>
            x.id === editingId
        );


      if(!s)
        return;


      s.name =
        name;

      s.status =
        status;

      s.notes =
        notes;


      await updateDoc(

        doc(
          db,
          "students",
          s.id
        ),

        {

          name:
            s.name,

          status:
            s.status,

          notes:
            s.notes

        }

      );


      selectedId =
        s.id;

    }


    /* =====================================================
       ADD NEW STUDENT
    ====================================================== */

    else{

      const progress = {};


      skills.forEach(
        skill => {

          progress[
            skillKey(skill)
          ] = 0;

        }
      );


      const newStudent = {

        name:name,

        status:status,

        notes:notes,

        progress:progress,

        history:[]

      };


      const docRef =
        await addDoc(
          studentsCollection,
          newStudent
        );


      students.push({

        id:
          docRef.id,

        ...newStudent

      });


      selectedId =
        docRef.id;

    }


    /* Sort alphabetically */

    students.sort(
      (a,b) =>
        a.name.localeCompare(
          b.name
        )
    );


    closeStudentModal();


    /*
      Rebuild dropdown
    */

    renderStudentDropdown();


    /*
      Show selected student
    */

    renderProfile();

  }

  catch(error){

    console.error(
      "Firestore student save error:",
      error
    );


    alert(
      "Could not save the student to Firebase."
    );

  }

};


/* =========================================================
   DELETE STUDENT
========================================================= */

window.deleteStudent =
async function(id){

  const s =
    students.find(
      x =>
        x.id === id
    );


  if(
    !s
  ){

    return;

  }


  const confirmed =
    confirm(
      `Delete ${s.name}? This will remove all progress history.`
    );


  if(!confirmed)
    return;


  try{

    await deleteDoc(

      doc(
        db,
        "students",
        id
      )

    );


    students =
      students.filter(
        x =>
          x.id !== id
      );


    /*
      Select another student
    */

    selectedId =
      students[0]?.id ||
      null;


    /*
      Refresh dropdown
    */

    renderStudentDropdown();


    /*
      Refresh profile
    */

    renderProfile();

  }

  catch(error){

    console.error(
      "Firestore delete error:",
      error
    );


    alert(
      "Could not delete the student from Firebase."
    );

  }

};


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(str){

  return String(str).replace(

    /[&<>"']/g,

    c => ({

      '&':
        '&amp;',

      '<':
        '&lt;',

      '>':
        '&gt;',

      '"':
        '&quot;',

      "'":
        '&#039;'

    }[c])

  );

}


/* =========================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================================= */

document
  .getElementById(
    "studentModal"
  )
  .addEventListener(
    "click",
    function(e){

      if(
        e.target.id ===
        "studentModal"
      ){

        closeStudentModal();

      }

    }
  );


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    if(user){

      /*
        User is logged in
      */

      hideLogin();


      /*
        Load students
      */

      await loadStudents();

    }

    else{

      /*
        User logged out
      */

      students =
        [];

      selectedId =
        null;


      /*
        Show login
      */

      showLogin();


      /*
        Reset dropdown
      */

      renderStudentDropdown();


      /*
        Reset profile
      */

      renderProfile();

    }

  }
);

</script>
